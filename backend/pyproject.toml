[project]
name = "age-ai-trading-backend"
version = "0.1.0"
description = "Financial news aggregation and analysis platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "yfinance>=0.2.50",
    "feedparser>=6.0.11",
    "httpx>=0.28.0",
    "anthropic>=0.69.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
